[project]
name = "ai-work-skill-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.20,<5", "PyYAML>=6,<7", "docgen", "litellm-ops"]

# M1: mcp/docgen, M3: mcp/litellm_ops 를 workspace member 로.
[tool.uv.workspace]
members = ["mcp/docgen", "mcp/litellm_ops"]

[tool.uv.sources]
docgen = { workspace = true }
litellm-ops = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "mcp/docgen/tests", "mcp/litellm_ops/tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "deterministic: 어디서나 실행",
    "host_cli: claude CLI 필요",
    "manual: 사람·모델 필요, 자동 실행 안 함",
]

[tool.ruff]
line-length = 100
target-version = "py39"          # templates/·skills/ 는 3.9 문법
# 서비스 골격 자산은 {{pkg}} 토큰이 든 템플릿이라 유효한 파이썬이 아니다(스캐폴드 시 치환).
extend-exclude = ["**/assets/service/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
