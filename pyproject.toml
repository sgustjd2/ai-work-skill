[project]
name = "ai-work-skill-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.20,<5", "PyYAML>=6,<7", "docgen"]

# M1: mcp/docgen 을 workspace member 로 추가. mcp/litellm_ops 는 M3.
[tool.uv.workspace]
members = ["mcp/docgen"]

[tool.uv.sources]
docgen = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "mcp/docgen/tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "deterministic: 어디서나 실행",
    "host_cli: claude CLI 필요",
    "manual: 사람·모델 필요, 자동 실행 안 함",
]

[tool.ruff]
line-length = 100
target-version = "py39"          # templates/·skills/ 는 3.9 문법

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
