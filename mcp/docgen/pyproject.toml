[project]
name = "docgen"
version = "0.1.0"
description = "ai-work-skill 문서 생성 엔진 — .doc.md/.deck.md → docx/pptx, 구성도·차트, 미리보기, 양식 추출"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "markdown-it-py>=3,<4",
    "mdit-py-plugins>=0.4",
    "PyYAML>=6,<7",
    "Pillow>=10,<12",
]

[project.scripts]
docgen = "docgen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
