[project]
name = "litellm-ops"
version = "0.1.0"
description = "ai-work-skill LiteLLM 게이트웨이 운영 MCP — 상태·비용·키·팀·설정 검증"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[project.scripts]
litellm-ops = "litellm_ops.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litellm_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
