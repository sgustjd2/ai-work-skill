name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest (hex-literal-in-sources 검사 포함)
        run: uv run pytest -m "not manual"

      - name: doc_lint 자기 검사 (하드 위반 0)
        run: uv run python -X utf8 templates/doc_lint.py --all docs skills references README.md CLAUDE.md
